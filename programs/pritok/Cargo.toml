[package]
name = "pritok"
version = "0.1.0"
description = "PRITOK: corporate actions for tokenized bonds"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pritok"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "=0.32.1", features = ["init-if-needed"] }
anchor-spl = { version = "=0.32.1", features = ["token", "token_2022", "token_2022_extensions", "associated_token"] }

[dev-dependencies]
litesvm = "0.7"
solana-keypair = "2.2"
solana-signer = "2.2"
solana-transaction = "2.2"
